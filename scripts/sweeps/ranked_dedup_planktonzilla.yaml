# ranked-dedup sweep on Planktonzilla (euclidean, no-proj) — 4x A6000 cluster pod.
#
# ranked-dedup = ragged-aware RINCE (full-bank depth-graded negatives + dedup + symmetric T->I),
# the fix for hybrid's per-rank-keep species starvation (see hybrid-ragged-starvation memory).
# Baselines @ step 2285, matched recipe: hybrid 0.07 < plain-RINCE 0.24 < plain-CL 0.37. This
# sweep tunes ranked-dedup's RECIPE (not the loss's tau schedule — left at defaults 0.1/0.5).
#
# FIXED (not swept): euclidean, no-proj, ranked-dedup, 12+12 LoRA blocks, batch 2048
# (micro-bs 512 x accum 1 x 4 GPUs — cross-GPU gather gives the full 2048 negatives; accum=1
# = exact gradient, so NO --cache-accum-cl). 20 epochs. tau schedule at defaults (0.1/0.5).
# SWEPT: lr 5e-5..2.5e-4, wd {1e-4, 1e-2, 2e-1}. Just the two optimizer knobs this round.
# PINNED: lora_r=lora_alpha=32 (E0c capacity), scheduler=onecycle, batch 2048 (512x1x4 GPUs).
#
# NOTE: this config is for the DOUBLY-FIXED loss (commit 8e6144f): (1) ragged self-match
# 5a3abbc + (2) ranked_infonce no longer drops confidently-wrong queries at the finest level
# 8e6144f. ALL earlier sweeps tuned a broken objective (the second bug made the finest level
# train only on already-correct examples), so NONE of their rankings — including the "best"
# 0.612 — are reliable. Re-sweep from scratch.
#
# THE COMPARISON: E0c plain-CL baseline (run 0o1s0wpx, r32/a32/warmupcos/batch768) -> FULL-SPLIT
# test/seen/species_f1 0.6418. With capacity pinned to E0c, a win/loss on test/seen/species_f1
# vs 0.6418 is a statement about the LOSS. Remaining confound: batch (2048 here vs E0c's 768) —
# but the batch-768 matched run undertrained (still climbing at ep20), so 2048/20ep is the
# regime where BOTH losses converge; keep it.
#
# Metric: eval/seen/species_f1 (the headline rank the starvation hit). bayes search.
#
# CLUSTER USAGE (in the pod; venv at /root/hp-venv, cache staged at /root/pz_cache):
#   cd /mnt/resources/hyperbolic-plankton && git pull --ff-only
#   export HP_CACHE=/root/pz_cache HP_SPLIT_DIR=/mnt/indices/hyperbolic_plankton_splits \
#          HP_CKPT_DIR=/mnt/resources/hyperbolic_plankton_ckpts HP_WANDB_DIR=/mnt/resources/wandb
#   /root/hp-venv/bin/wandb sweep --project hyperbolic-plankton-sweep scripts/sweeps/ranked_dedup_planktonzilla.yaml
#   # then run the agent it prints (each trial = one full 20-epoch 4-GPU run):
#   /root/hp-venv/bin/wandb agent uofg/hyperbolic-plankton-sweep/<id>

program: scripts/train_lora.py
method: bayes
metric:
  name: eval/seen/species_f1
  goal: maximize

# NO hyperband. It ranks trials on LEVEL at a fixed step, so it repeatedly killed runs that were
# still CLIMBING steeply — just behind their peers at the bracket (esp. onecycle, whose 6-epoch
# ramp leaves it behind warmupcos at any early bracket). Instead, train_lora does PER-TRIAL
# PLATEAU early-stop (--early-stop-patience below): each run is judged on ITS OWN trajectory and
# only stops once eval/seen/species_f1 has been flat for N evals — a climber never stops.
# A diverged trial (NaN) still self-aborts via train_lora's divergence guard (logs species_f1=0).

parameters:
  # ONLY lr and wd this round. Everything else pinned (lora_r/alpha=32 to E0c capacity, scheduler
  # =onecycle in the command, batch 2048). The prior "best" scheduler/lr were found under the buggy
  # loss so aren't trusted — but pinning onecycle keeps the sweep small and it's E0c-comparable;
  # revisit scheduler in a follow-up if lr/wd tuning doesn't reach the 0.6418 bar.
  # lr range 5e-5..2.5e-4: E0c's lr (1e-4) is inside it; sweeps have repeatedly shown >~3e-4
  # collapses and the optimum sits mid-range. The loss dynamics changed with 8e6144f, so bayes
  # re-explores within this range.
  lr:
    distribution: log_uniform_values
    min: 5.0e-5
    max: 2.5e-4
  # wd: 1e-4 (ranked-dedup's prior best) .. 1e-2 .. 2e-1 (E0c's value).
  wd:
    values: [1.0e-4, 1.0e-2, 2.0e-1]

command:
  - ${env}
  - /root/hp-venv/bin/torchrun
  - --nproc_per_node=4
  - --master_port=29573
  - ${program}
  - --dataset=planktonzilla
  - --backbone=clip
  - --geometry=euclidean
  - --contrastive=ranked-dedup
  - --rince-sim=distance
  - --no-proj
  - --epochs=20
  - --micro-bs=512
  - --accum=1
  - --lora-r=32                  # PINNED: E0c capacity
  - --lora-alpha=32              # PINNED: E0c capacity (E0c's default alpha=r=32)
  - --lora-visual-blocks=12
  - --lora-text-blocks=12
  - --scheduler=onecycle         # PINNED this round (led last sweep; E0c-comparable)
  - --warmup-frac=0.1
  - --onecycle-pct-start=0.3
  - --onecycle-min-lr=1e-6
  - --lambda-cl=1.0
  - --lambda-sel=0.0
  - --seed=0
  - --compile
  - --eval-epochs=1.0
  - --early-stop-patience=4      # stop a trial only after 4 flat evals (climbers never stop)
  - --early-stop-min-delta=0.002
  - --num-workers=2              # PER-RANK; 2x4 GPUs = 8 procs = the 8 pod CPUs (8 would give 32!)
  - --prefetch-factor=6
  - --wandb-project=hyperbolic-plankton-sweep
  - ${args}   # swept: lr, wd only (everything else pinned above)
